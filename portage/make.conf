COMMON_FLAGS="-O2 -pipe"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"

LC_MESSAGES=C.utf8

PORTAGE_NICENESS="10"
EMERGE_DEFAULT_OPTS="--verbose --color y --getbinpkg=y --usepkg=y --binpkg-respect-use=y --binpkg-changed-deps=y"

# dosnt work in docker, needs additional privileges to do so.
FEATURES="-ipc-sandbox -network-sandbox -pid-sandbox -binpkg-request-signature"
